[package]
name = "aegis"
version = "0.2.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
license = "AGPL-3.0-or-later"
description = "Sovereign agent runtime with defense plane, context branching, and streaming gateway"
repository = "https://github.com/aien-dev/aegis-runtime"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["json", "macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
anyhow = "1.0.104"
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1.6"
sha2 = "0.10"
libc = "0.2"

# Canonical AIEN Protocol Crates
aien-protocol-types = { path = "../aien-protocols/crates/aien-protocol-types" }
aien-action-protocol = { path = "../aien-protocols/crates/aien-action-protocol" }
aien-probe = { path = "../aien-protocols/crates/aien-probe" }
aien-agent-state-abi = { path = "../aien-protocols/crates/aien-agent-state-abi" }
aien-inference-protocol = { path = "../aien-protocols/crates/aien-inference-protocol" }
aien-inference-client = { path = "../aien-protocols/crates/aien-inference-client" }

[dev-dependencies]
tempfile = "3.17"
tokio-tungstenite = "0.24"

[[bin]]
name = "aegis"
path = "src/main.rs"

[lib]
name = "aegis"
path = "src/lib.rs"
