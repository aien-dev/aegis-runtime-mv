# SBOM: writes an SPDX JSON inventory of the tree at every push to main and on pull requests, as
# a workflow artifact, so outside auditors can diff what a commit contains. Read-only token;
# every action pinned by full commit sha. It judges nothing and gates nothing.
name: SBOM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
